name: Python Tests

on:
  workflow_call:

jobs:
  build:
    name: Build & test via docker-compose
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v1

    - name: Build the Stack
      run:  docker compose -f docker-compose-dev.yaml build

    - name: Start containers
      run: docker compose -f docker-compose-dev.yaml up -d

    - name: List containers
      run: docker ps

    - name: Wait for the database and web container
      run: |
        for attempt in $(seq 1 90); do
          if docker compose -f docker-compose-dev.yaml exec -T db pg_isready -U mediacms && docker compose -f docker-compose-dev.yaml exec -T web true; then
            exit 0
          fi
          sleep 2
        done
        docker compose -f docker-compose-dev.yaml logs
        exit 1
      shell: bash

    - name: Run Django Tests
      run: docker compose -f docker-compose-dev.yaml exec --env TESTING=True -T web pytest -n auto --durations=20 --cov --cov-report=term

    - name: Tear down the Stack
      run:  docker compose -f docker-compose-dev.yaml down

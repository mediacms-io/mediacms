# Use existing X-Forwarded-Proto from reverse proxy if present, otherwise use $scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80 ;

    gzip on;
    access_log /var/log/nginx/mediacms.io.access.log;

    error_log  /var/log/nginx/mediacms.io.error.log  warn;

    if ($request_uri ~ "(?:^|/|%2[fF])\.\.(?:/|%2[fF]|\?|$)") {
        return 403;
    }

    location /static {
        alias /home/mediacms.io/mediacms/static ;
    }
    location = /_media_auth {
        internal;
        proxy_pass http://127.0.0.1:9000/api/v1/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Cookie $http_cookie;
    }

    location ^~ /_protected_pdf/ {
        internal;
        alias /home/mediacms.io/mediacms/media_files/;
        types { }
        default_type application/pdf;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private" always;
    }

    # Uploads keep their original extension, so only known media types are served inline;
    # anything else (html, svg, js...) is downloaded instead of rendered on this origin
    location ~ ^/media/original/(.*)$ {
        auth_request /_media_auth;
        alias /home/mediacms.io/mediacms/media_files/original/$1;

        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/avif avif;
            image/bmp bmp;
            video/mp4 mp4 m4v;
            video/webm webm;
            video/quicktime mov;
            video/x-matroska mkv;
            video/ogg ogv;
            video/x-msvideo avi;
            video/mpeg mpeg mpg;
            video/3gpp 3gp;
            video/x-flv flv;
            video/x-ms-wmv wmv;
            video/mp2t ts;
            audio/mpeg mp3;
            audio/mp4 m4a;
            audio/ogg ogg oga opus;
            audio/wav wav;
            audio/flac flac;
            audio/aac aac;
            application/pdf pdf;
            text/vtt vtt;
            text/plain srt txt;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;

        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    }

    location ~ ^/media/(encoded|hls)/(.*)$ {
        auth_request /_media_auth;
        alias /home/mediacms.io/mediacms/media_files/$1/$2;

        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    }

    location /media {
        alias /home/mediacms.io/mediacms/media_files ;
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    }

    location / {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

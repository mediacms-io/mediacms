{% block messages %}

{% if messages %}

{% for message in messages %}
	<div class="alert {{ message.tags }} alert-dismissible" role="alert">
    	<button type="button" class="close" data-dismiss="alert" aria-label="Close">
      		<span aria-hidden="true">&times;</span>
    	</button>
    	{{ message }}
  	</div>
{% endfor %}

<script>
    // This script is necessary because the React-based PageHeader component (which handles alert dismissal)
    // is not mounted on all Django-rendered pages. This ensures the close button works globally.
    document.addEventListener('DOMContentLoaded', function() {
        function dismiss(alert) {
            if (alert.classList.contains('hiding')) {
                return;
            }
            alert.classList.add('hiding');
            setTimeout(function() {
                if (alert.parentNode) {
                    alert.parentNode.removeChild(alert);
                }
            }, 400);
        }

        document.querySelectorAll('.alert').forEach(function(alert) {
            var closeBtn = alert.querySelector('.close');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    dismiss(alert);
                });
            }

            // Errors stay until closed so they are not missed
            if (alert.classList.contains('error')) {
                return;
            }

            var timer;
            function schedule() {
                clearTimeout(timer);
                timer = setTimeout(function() {
                    dismiss(alert);
                }, 5000);
            }
            function pause() {
                clearTimeout(timer);
            }
            alert.addEventListener('mouseenter', pause);
            alert.addEventListener('focusin', pause);
            alert.addEventListener('mouseleave', schedule);
            alert.addEventListener('focusout', schedule);
            schedule();
        });
    });
</script>

{% endif %}

{% endblock %}

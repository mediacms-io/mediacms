{% extends "admin/change_form.html" %}
{% load i18n jazzmin %}
{% get_jazzmin_ui_tweaks as jazzmin_ui %}

{% block extra_actions %}
{{ block.super }}
{% if object_action_choices %}
<li class="object-tools-actions">
    <form method="post" action="{{ object_action_url }}" class="object-tools-actions-form">
        {% csrf_token %}
        <label class="sr-only" for="id_object_action">{% trans "Actions" %}</label>
        <select name="action" id="id_object_action" class="form-control object-tools-actions-select" required>
            {% for value, label, disabled in object_action_choices %}
            <option value="{{ value }}"{% if disabled %} disabled{% endif %}{% if not value %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn {{ jazzmin_ui.button_classes.primary }} btn-sm object-tools-actions-go" title="{% trans "Run the selected action" %}">
            {% trans "Go" %}
        </button>
    </form>
</li>
{% endif %}
{% endblock %}
